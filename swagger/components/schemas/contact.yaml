type: object
required:
  - name
  - phoneNumber
  - contactType
  - userId
properties:
  name:
    type: string
    description: "Contact's name"
    example: 'John Doe'
  phoneNumber:
    type: string
    description: 'Phone number'
    example: '+380123456789'
  email:
    type: string
    description: 'Email address'
    example: 'johndoe@example.com'
  isFavourite:
    type: boolean
    description: 'Indicates if the contact is marked as favorite'
    example: false
  contactType:
    type: string
    description: 'Type of contact'
    enum: ['work', 'home', 'personal']
    example: 'personal'
  userId:
    type: string
    description: 'ID of the user who owns the contact'
    example: '60d0fe4f5311236168a109ca'
  photo:
    type: string
    description: "URL to the contact's photo"
    example: 'https://res.cloudinary.com/dw3qjido8/image/upload/v1743113771/zo6dstqb…'
  createdAt:
    type: string
    format: date-time
    description: 'Timestamp of when the contact was created'
    example: '2024-03-31T12:00:00Z'
  updatedAt:
    type: string
    format: date-time
    description: 'Timestamp of when the contact was last updated'
    example: '2024-03-31T12:30:00Z'
