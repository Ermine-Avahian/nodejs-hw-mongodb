tags:
  - Auth
summary: Reset user password
operationId: resetPassword
description: Resets the user's password using a valid reset token sent to their email.
security: []
requestBody:
  required: true
  content:
    application/json:
      schema:
        type: object
        required:
          - resetToken
          - password
        properties:
          resetToken:
            type: string
            description: 'Token received in the password reset email.'
            example: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...'
          password:
            type: string
            description: "The new password to set for the user's account."
            example: 'SecureP@ssw0rd'
responses:
  '200':
    description: Password has been successfully reset.
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: Password has been successfully reset.
  '401':
    $ref: '../../components/responses/401.yaml'
