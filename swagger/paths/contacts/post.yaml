tags:
  - Contacts
summary: Create contact
operationId: createContact
description: 'Create a contact with payload'
requestBody:
  content:
    multipart/form-data:
      schema:
        type: object
        required:
          - name
          - phoneNumber
          - contactType
          - userId
        properties:
          name:
            description: "Contact's name"
            type: string
            example: 'John Doe'
          phoneNumber:
            description: 'Phone number'
            type: string
            example: '+380123456789'
          email:
            type: string
            description: 'Email address'
            example: 'johndoe@example.com'
          isFavourite:
            type: boolean
            description: 'Indicates if the contact is marked as favorite'
            example: false
          contactType:
            description: 'Contact type'
            type: string
            enum: ['work', 'home', 'personal']
          userId:
            description: 'User ID reference'
            type: string
            example: '60d0fe4f5311236168a109ca'
          photo:
            type: string
            description: "URL to the contact's photo"
            example: 'https://res.cloudinary.com/dw3qjido8/image/upload/v1743113771/zo6dstqb…'
          createdAt:
            type: string
            format: date-time
            description: 'Timestamp of when the contact was created'
            example: '2024-03-31T12:00:00Z'
          updatedAt:
            type: string
            format: date-time
            description: 'Timestamp of when the contact was last updated'
            example: '2024-03-31T12:30:00Z'
responses:
  '201':
    description: Creates a contact
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 201
            message:
              type: string
              example: Successfully created a contact!
            data:
              $ref: '../../components/schemas/contact.yaml'
  '401':
    $ref: '../../components/responses/401.yaml'
