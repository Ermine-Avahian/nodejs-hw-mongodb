tags:
  - Contacts
summary: Update a contact
operationId: updateContact
description: Update an existing contact by ID.
security:
  - bearerAuth: []
parameters:
  - in: path
    name: contactId
    required: true
    schema:
      type: string
requestBody:
  required: true
  content:
    application/json:
      schema:
        type: object
        properties:
          name:
            type: string
            description: "Contact's name"
            example: 'John Doe'
          phoneNumber:
            type: string
            description: 'Phone number'
            example: '+380123456789'
          email:
            type: string
            description: 'Email address'
            example: 'johndoe@example.com'
          isFavourite:
            type: boolean
            description: 'Indicates if the contact is marked as favorite'
            example: false
          contactType:
            type: string
            description: 'Contact type'
            enum: ['work', 'home', 'personal']
          userId:
            type: string
            description: 'User ID reference'
            example: '60d0fe4f5311236168a109ca'
          photo:
            type: string
            description: "URL to the contact's photo"
            example: 'https://res.cloudinary.com/dw3qjido8/image/upload/v1743113771/zo6dstqb…'
responses:
  '200':
    description: Contact updated successfully
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: Successfully updated the contact!
            data:
              type: object
              $ref: '../../../components/schemas/contact.yaml'
  '400':
    $ref: '../../../components/responses/400.yaml'
  '401':
    $ref: '../../../components/responses/401.yaml'
