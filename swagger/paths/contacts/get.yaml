tags:
  - Contacts
summary: Get a list of contacts
operationId: getContacts
description: Get list of contacts with this endpoint
parameters:
  - in: query
    name: name
    schema:
      type: string
      example: 'John Doe'
  - in: query
    name: phoneNumber
    schema:
      type: string
      example: '+380123456789'
  - in: query
    name: email
    schema:
      type: string
      example: 'johndoe@example.com'
  - in: query
    name: contactType
    schema:
      type: string
      enum: [work, home, personal]
      example: home
  - in: query
    name: isFavourite
    schema:
      type: boolean
      example: true
responses:
  '200':
    description: Successfully found contacts!
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: Successfully found contacts!
            data:
              type: object
              required:
                - data
                - page
                - perPage
                - totalItems
                - totalPages
                - hasNextPage
                - hasPreviousPage
              properties:
                data:
                  type: array
                  items:
                    $ref: '../../components/schemas/contact.yaml'
                page:
                  type: number
                  example: 1
                perPage:
                  type: number
                  example: 3
                totalItems:
                  type: number
                  example: 3
                totalPages:
                  type: number
                  example: 3
                hasNextPage:
                  type: boolean
                  example: false
                hasPreviousPage:
                  type: boolean
                  example: false
  '401':
    $ref: '../../components/responses/401.yaml'
